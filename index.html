<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1727">
  <meta name="description" content="Интерактивный учебный тренажёр по технологическим регламентам металлургического производства для специальности 09.02.11.">
  <title>Металлургия: от регламента к коду — учебный симулятор</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css?v=2.0.0">
  <script src="./js/data.js?v=2.0.0" defer></script>
  <script src="./js/engine.js?v=2.0.0" defer></script>
  <script src="./js/app.js?v=2.0.1" defer></script>
  <!-- MetalLab PR1 extension -->
  <link rel="stylesheet" href="./css/pr1.css?v=1.1.0">
  <script src="./js/pr1-core.js?v=1.1.0" defer></script>
  <script src="./js/pr1-addon.js?v=1.1.0" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">

    <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 3"/></symbol>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <div class="brand">
        <div class="brand-icon"><svg class="ico" aria-hidden="true"><use href="#ic-bolt"/></svg></div>
        <div><div class="brand-main">МЕТАЛЛАБ</div><div class="brand-sub">ЦИФРОВАЯ ЛАБОРАТОРИЯ</div></div>
      </div>
      <div class="side-section-label">СИМУЛЯТОР</div>
      <nav class="sidebar-nav" aria-label="Разделы тренажёра">
        <button type="button" class="nav-item active" data-view="operator"><svg class="ico"><use href="#ic-grid"/></svg><span>Пульт оператора</span></button>
        <button type="button" class="nav-item" data-view="regulation"><svg class="ico"><use href="#ic-book"/></svg><span>Регламент</span></button>
        <button type="button" class="nav-item" data-view="workshop"><svg class="ico"><use href="#ic-clipboard"/></svg><span>Мастерская требований</span></button>
        <button type="button" class="nav-item" data-view="practice"><svg class="ico"><use href="#ic-target"/></svg><span>Задания</span></button>
        <button type="button" class="nav-item" data-view="logic"><svg class="ico"><use href="#ic-code"/></svg><span>Лаборатория тестирования</span></button>
        <button type="button" class="nav-item" data-view="revision"><svg class="ico"><use href="#ic-refresh"/></svg><span>Регламент изменился</span></button>
        <button type="button" class="nav-item" data-view="production"><svg class="ico"><use href="#ic-grid"/></svg><span>Производственные кейсы</span></button>
        <button type="button" class="nav-item" data-view="architecture"><svg class="ico"><use href="#ic-network"/></svg><span>Диагностика данных</span></button>
      </nav>
      <div class="side-section-label second">ПРЕПОДАВАНИЕ</div>
      <nav class="sidebar-nav" aria-label="Обучение и результаты">
        <button type="button" class="nav-item" data-view="results"><svg class="ico"><use href="#ic-chart"/></svg><span>Мои результаты</span></button>
        <button type="button" class="nav-item" data-view="teacher"><svg class="ico"><use href="#ic-sliders"/></svg><span>Преподавателю</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="reg-chip"><span class="signal-dot"></span><span id="regChip">ТР-УЧ-01 v1.0</span></div>
        <div class="sidebar-disclaimer">Учебная модель.<br>Без связи с оборудованием.</div>
        <div class="sidebar-copyright">ОП.10 · СПО 09.02.11</div>
      </div>
    </aside>
    <div class="work-area">
      <header class="topbar">
        <div class="breadcrumb"><span>ОСНОВЫ МЕТАЛЛУРГИИ</span><svg class="ico small"><use href="#ic-chevron"/></svg><strong id="breadcrumbCurrent">Пульт оператора</strong></div>
        <div class="topbar-right">
          <span class="lesson-chip">ТЕМА 1.2</span>
          <span class="connection-pill"><span class="signal-dot"></span> OFFLINE READY</span>
        </div>
      </header>
      <div id="saveWarning" class="save-warning" role="alert" hidden></div>
      <main id="main" class="main" tabindex="-1"></main>
      <footer class="site-footer"><span>Учебная цифровая лаборатория · ТР-УЧ-01 · Условные параметры</span><span>Никакого подключения к PLC / SCADA / оборудованию</span></footer>

  </div>
